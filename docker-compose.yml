services:
  app:
    build:
      context: ./job-app
      dockerfile: Dockerfile
    container_name: job_app
    working_dir: /var/www/html
    volumes:
      - ./job-app:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: bash -c "php artisan serve --host=0.0.0.0 --port=8000"

  backoffice:
    build:
      context: ./job-backoffice
      dockerfile: Dockerfile
    container_name: job_backoffice
    working_dir: /var/www/html
    volumes:
      - ./job-backoffice:/var/www/html
    ports:
      - "8011:8000"
    depends_on:
      - db
    command: bash -c "php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: mysql:8
    container_name: job_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: job_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root

volumes:
  mysql_data:
